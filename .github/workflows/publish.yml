# 청년줍줍 예약 발행 — PC 가 꺼져 있어도 대기열(queue/오늘날짜)을 게시한다.
# 원본: jubjub-auto/cloud/publish.yml → youth-jubjub-cards/.github/workflows/publish.yml 로 배포
name: 예약 발행

on:
  schedule:
    # 매시간. GitHub 예약 실행은 수 시간씩 밀려서(실측 5~9시간) 하루 한 번 예약으로는
    # 저녁 발행을 맞출 수 없다. 발행기는 19:00~23:30 KST 에 든 실행에서만 게시하고
    # 이미 게시했으면 아무것도 안 한다. 정각을 피하면 GitHub 혼잡이 덜하다.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "게시할 날짜 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
      dry_run:
        description: "켜두면 컨테이너 생성까지만 하고 게시하지 않음"
        type: boolean
        default: true

permissions:
  contents: write            # published.json 기록 커밋

concurrency:
  group: publish             # 두 실행이 겹쳐 같은 날을 두 번 올리는 일이 없게
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 게시
        env:
          IG_API_MODE: ${{ secrets.IG_API_MODE }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IN_DATE: ${{ inputs.date }}
          IN_DRY: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ "$IN_DRY" = "true" ] && args+=(--dry-run)
          [ "$EVENT" = "schedule" ] && args+=(--scheduled)
          python3 publisher/publish_queue.py "${args[@]}"

      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "jubjub-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 따로따로 추가한다. 한 명령에 넣으면 경로 하나(예: 아직 없는 state/)가 없을 때
          # git add 전체가 실패해 published.json 까지 빠진다(2026-10-12: 게시는 됐는데 기록이
          # 안 남아 다음 날 "놓쳤어요" 오알림).
          git add queue/*/published.json 2>/dev/null || true
          [ -d state ] && git add state 2>/dev/null || true
          if git diff --cached --quiet; then echo "기록할 것 없음"; exit 0; fi
          git commit -m "게시 기록 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
